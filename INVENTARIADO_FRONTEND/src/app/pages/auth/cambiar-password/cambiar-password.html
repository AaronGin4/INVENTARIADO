<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Cambiar Contraseña</h2>
      <p>Establece una nueva contraseña para tu cuenta</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label for="new-password">Nueva Contraseña</label>
        <input type="password" id="new-password" placeholder="Mínimo 8 caracteres" />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirm-password" placeholder="Repite la contraseña" />
      </div>

      <button type="button" class="btn-primary">Actualizar Contraseña</button>

      <div class="auth-footer">
        <a href="#" class="back-link">← Volver al inicio de sesión</a>
      </div>
    </form>
  </div>
</div>
