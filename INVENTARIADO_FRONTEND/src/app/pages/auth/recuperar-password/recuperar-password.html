<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Recuperar Contraseña</h2>
      <p>Introduce tu correo para recibir un enlace de restablecimiento</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico Registrado</label>
        <input type="email" id="email" placeholder="usuario@ejemplo.com" autocomplete="off" />
      </div>

      <button type="button" class="btn-primary">Enviar Enlace</button>

      <div class="auth-footer">
        <a href="#" class="back-link">← Volver al inicio de sesión</a>
      </div>
    </form>
  </div>
</div>
